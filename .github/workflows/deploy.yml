# CI only — this workflow deploys NOTHING.
#
# Production is Cloudflare Pages via wrangler direct upload
# ("Israeli services sites/ops/deploy-site.ps1 -Domain betonplus.co.il"). The previous
# GitHub Pages publish steps were removed 2026-08-17: they kept a stale second origin
# alive. This job now just runs the repo's build gate on every push/PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
